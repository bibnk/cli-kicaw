[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hash256-miner"
version = "0.1.0"
description = "GPU (OpenCL) proof-of-work miner for the HASH256 ($HASH) mineable ERC-20"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "web3>=6.15,<8",
    "eth-account>=0.11",
    "eth-utils>=4.0",
    "eth-abi>=5.0",
    "pyopencl>=2024.1",
    "numpy>=1.24",
    "click>=8.1",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.2"]

[project.scripts]
hashminer = "hashminer.cli:main"

[tool.hatch.build.targets.wheel]
include = ["hashminer"]

[tool.hatch.build.targets.wheel.force-include]
"hashminer/kernels/keccak256.cl" = "hashminer/kernels/keccak256.cl"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-p no:pytest_ethereum`: web3 ships a legacy pytest plugin that breaks on modern eth-typing;
# we don't use it, so disable its autoload.
addopts = "-ra -p no:pytest_ethereum"
markers = [
    "gpu: requires a working OpenCL device",
    "fork: requires a local anvil/hardhat fork (RPC at $FORK_RPC_URL)",
]
